<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="CrabBots attendance: face recognition, instant enrolment and live attendance." />
  <title>CrabBots Attendance</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css?v=20261124-pose-guidance-no-mesh" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard" aria-label="CrabBots Attendance home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 13c0-3.3 3.1-6 7-6s7 2.7 7 6" />
            <path d="M7 17c0-3 4-5.5 9-5.5S25 14 25 17c0 4.4-3.6 7-9 7s-9-2.6-9-7Z" />
            <path d="M10 12 6.5 8.5M22 12l3.5-3.5M6.5 20.5 3 24M25.5 20.5 29 24M13 24l-2 4M19 24l2 4" />
            <circle cx="12.6" cy="15.6" r="1.05" fill="currentColor" stroke="none" />
            <circle cx="19.4" cy="15.6" r="1.05" fill="currentColor" stroke="none" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>CrabBots</strong>
          <small>Attendance</small>
        </span>
      </a>

      <nav class="nav" id="nav" aria-label="Main navigation"></nav>

      <div class="sidebar-foot">
        <div class="health-pill" id="health-pill" title="System health">
          <span class="dot"></span><span class="health-label">Connecting…</span>
        </div>
        <div class="version" id="version">v1.0.0</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="page-heading">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle">Today at a glance</p>
        </div>
        <div class="topbar-actions">
          <button class="session-chip" id="session-chip" type="button" title="Active session">
            <span class="pulse-dot"></span>
            <span class="session-text" id="session-text">No session</span>
          </button>
          <button class="btn btn-ghost" id="btn-session-manage" type="button">Sessions</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toasts" role="status" aria-live="polite"></div>

  <script src="/static/app.js?v=20261124-pose-guidance-no-mesh" defer></script>
</body>
</html>
